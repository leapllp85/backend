[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:ssl-cert-generator]
command=/app/scripts/generate-ssl-certs.sh
autostart=true
autorestart=false
startsecs=0
exitcodes=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ssl-certs.log
priority=100

[program:django]
command=gunicorn --bind 127.0.0.1:8000 --workers 2 --worker-class sync --timeout 120 --max-requests 1000 --max-requests-jitter 100 --preload backend.wsgi:application
directory=/app
user=django
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/django.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
depends_on=ssl-cert-generator

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
depends_on=django
